version: '3.9'

services:
  web:
    build: ./django_core
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./django_core:/django_core
    ports:
      - '8000:8000'

    environment:
      # Stripe specific keys
      STRIPE_PUBLIC_KEY: ${STRIPE_PUBLIC_KEY}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      DJSTRIPE_TEST_WEBHOOK_SECRET: ${DJSTRIPE_TEST_WEBHOOK_SECRET}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD}

    depends_on:
      - celery
      - rabbit

  redis:
    image: redis:7.0.4
    restart: always
    expose:
      - 6379


  rabbit:
    image: rabbitmq:management

    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    ports:
      - "5672:5672"
      - "15672:15672"


  celery:
    restart: always
    build: ./django_core
    command: celery -A myshop.celery worker -l info -P solo
    volumes:
      - ./django_core:/django_core

    environment:
      - CELERY_BROKER_URL=amqp://${RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASS}@rabbit:5672//

    links:
      - rabbit
    depends_on:
      - rabbit


  stripe:
    image: stripe/stripe-cli:v1.19.4
    command: listen --api-key=${STRIPE_SECRET_KEY} --device-name=nikolay --forward-to=web:8000/payment/webhook/
    depends_on:
      - web



