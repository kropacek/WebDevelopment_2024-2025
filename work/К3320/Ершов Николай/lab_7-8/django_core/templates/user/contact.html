{% extends "shop/base.html" %}
{% load i18n %}
{% block title %}Обратная связь{% endblock %}
{% block content %}
<h1>Обратная связь</h1>
<div class="wrapper">
    <div class="profile-container">
        <form method="post">
            {% csrf_token %}
            {% for field in form %}
                <div class="form-group">
                    {{field.label_tag}}
                    <div>{{field}}</div>
                    <div class="error">{{field.errors}}</div>
                </div>
            {% endfor %}

            <div class="form-group">
                <input type="submit" value="{% trans "Отправить" %}">
            </div>
        </form>
    </div>
</div>
{% endblock %}
